services:
  redis:
    image: redis:8.2.6
    ports:
      - "127.0.0.1:6379:6379"
    command:
      - sh
      - -c
      - exec redis-server --appendonly yes --requirepass "$$(cat /run/secrets/redis_password)"
    secrets:
      - redis_password
    volumes:
      - coforge_redis_data:/data
    networks:
      - centrifugo
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$(cat /run/secrets/redis_password)\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  postgres:
    image: postgres:18.6
    shm_size: 128mb
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: coforge
      POSTGRES_DB: coforge
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    secrets:
      - postgres_password
    volumes:
      - coforge_postgres_data:/var/lib/postgresql
    networks:
      - centrifugo
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coforge -d coforge"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  centrifugo:
    image: centrifugo/centrifugo:v6.9.2
    command:
      - sh
      - -c
      - >-
        export CENTRIFUGO_HTTP_API_KEY="$$(cat /run/secrets/centrifugo_http_api_key)";
        export CENTRIFUGO_CLIENT_PROXY_CONNECT_ENDPOINT="$${COFORGE_CONNECT_PROXY_ENDPOINT:-http://host.docker.internal:8789/api/internal/centrifugo-connect}";
        export CENTRIFUGO_RPC_PROXY_ENDPOINT="$${COFORGE_RPC_PROXY_ENDPOINT:-http://host.docker.internal:8789/api/internal/centrifugo}";
        export CENTRIFUGO_CHANNEL_PROXY_PUBLISH_ENDPOINT="$${COFORGE_ACTIVITY_PROXY_ENDPOINT:-http://host.docker.internal:8789/api/internal/centrifugo-agent-activity}";
        export CENTRIFUGO_VAR_RPC_PROXY_SECRET="$$(cat /run/secrets/centrifugo_proxy_secret)";
        export CENTRIFUGO_ENGINE_REDIS_ADDRESS="redis://:$$(cat /run/secrets/redis_password)@redis:6379";
        exec centrifugo -c /centrifugo/config.yaml
    ports:
      - "8000:8000"
    volumes:
      - ./centrifugo:/centrifugo:ro
    secrets:
      - centrifugo_http_api_key
      - centrifugo_proxy_secret
      - redis_password
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - centrifugo
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  # One private, SQLite-owning Rust runtime per environment. Local development
  # may expose it on loopback only for a host-run Web server; staging has no
  # host port and attaches only Web plus this service to its internal network.
  causal-memory:
    image: ${COFORGE_CAUSAL_MEMORY_IMAGE:?COFORGE_CAUSAL_MEMORY_IMAGE must be a reviewed local image or immutable digest}
    environment:
      CAUSAL_MEMORY_DB: /data/causal-memory.sqlite
      CAUSAL_MEMORY_TOKENS_FILE: /run/secrets/coforge_causal_memory_tenant_tokens
      CAUSAL_MEMORY_DISTILL_MODEL_API_KEY_FILE: /run/secrets/coforge_causal_memory_distill_model_api_key
      CAUSAL_MEMORY_ALLOWED_HOSTS: causal-memory,localhost,127.0.0.1,::1
    ports:
      - "127.0.0.1:${CAUSAL_MEMORY_PORT:-9938}:9938"
    secrets:
      - coforge_causal_memory_tenant_tokens
      - coforge_causal_memory_distill_model_api_key
    volumes:
      - coforge_causal_memory_data:/data
    networks:
      - causal-memory
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --show-error http://127.0.0.1:9938/healthz && curl --fail --silent --show-error http://127.0.0.1:9938/readyz"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 15s
    restart: unless-stopped

networks:
  centrifugo:
    driver: bridge
    name: coforge_network
  causal-memory:
    internal: true

volumes:
  coforge_redis_data:
    name: coforge_redis_data
  coforge_postgres_data:
    name: coforge_postgres_data
  coforge_causal_memory_data:
    name: coforge_causal_memory_data

secrets:
  redis_password:
    file: ./secrets/redis_password
  centrifugo_proxy_secret:
    file: ./secrets/centrifugo_proxy_secret
  centrifugo_http_api_key:
    file: ./secrets/centrifugo_http_api_key
  postgres_password:
    file: ./secrets/postgres_password
  coforge_causal_memory_tenant_tokens:
    file: ./secrets/coforge_causal_memory_tenant_tokens
  coforge_causal_memory_distill_model_api_key:
    file: ./secrets/coforge_causal_memory_distill_model_api_key
