# Non-secret Centrifugo configuration for the coforge-staging Compose project.
# Secret values are supplied by Compose secrets; the RPC proxy secret reaches
# the process through the CENTRIFUGO_VAR_RPC_PROXY_SECRET env export.
# Endpoints point at the in-network web backend instead of the host.
engine:
  type: redis
  redis:
    address: "redis:6379"

health:
  enabled: true

admin:
  enabled: false

log:
  level: info

# Largest single message received from a client (websocket.message_size_limit, default 64 KiB).
# Two RPC replies from the Computer exceed the default: a Workspace File read (up to 1 MiB of
# text, packages/daemon/src/agent-runtime/agent-workspace-files.ts) and the Code Agent inventory
# (every runtime's model catalog, ~145 KB with six runtimes). Over the limit Centrifugo closes
# the socket with "message too big", which the client treats as final and never reconnects, so
# the Computer silently stops receiving Agent control. 2 MiB leaves room for the envelope.
# Keep this the only `websocket:` key: a duplicate top-level key is a YAML error and Centrifugo
# exits at start.
websocket:
  message_size_limit: 2097152

client:
  allowed_origins:
    - https://staging.coforge.cn
  token:
    jwks_public_endpoint: http://web:3000/api/jwks
    audience: coforge-centrifugo
    issuer: coforge
  proxy:
    connect:
      enabled: true
      endpoint: http://web:3000/api/internal/centrifugo-connect
      timeout: 5s
      http:
        static_headers:
          X-CoForge-Centrifugo-Proxy-Secret: ${CENTRIFUGO_VAR_RPC_PROXY_SECRET}

channel:
  proxy:
    publish:
      endpoint: http://web:3000/api/internal/centrifugo-agent-activity
      timeout: 1s
      binary_encoding: true
      include_connection_meta: true
      http:
        static_headers:
          X-CoForge-Centrifugo-Proxy-Secret: ${CENTRIFUGO_VAR_RPC_PROXY_SECRET}
  namespaces:
    - name: workspace
    - name: daemon
    - name: chat
      history_size: 200
      history_ttl: 5m
      force_recovery: true
    - name: agent
      publish_proxy_enabled: true
      publication_data_format: binary

rpc:
  proxy:
    endpoint: http://web:3000/api/internal/centrifugo
    timeout: 5s
    binary_encoding: true
    include_connection_meta: true
    http:
      static_headers:
        X-CoForge-Centrifugo-Proxy-Secret: ${CENTRIFUGO_VAR_RPC_PROXY_SECRET}
  without_namespace:
    proxy_enabled: true
  namespaces:
    - name: agent
      proxy_enabled: true
    - name: computer
      proxy_enabled: true
    - name: workspace
      proxy_enabled: true
    - name: daemon
      proxy_enabled: true
