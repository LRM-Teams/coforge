# Non-secret Centrifugo configuration. Secret values are supplied by Compose
# environment variables so they never need to be committed to this repository.
engine:
  type: redis

# A Daemon's Code Agent inventory carries every runtime's model catalog in one
# RPC (~145 KB of JSON with six runtimes). Above this limit Centrifugo closes the
# socket with "message too big", which the client treats as final and never
# reconnects, so the Computer silently stops receiving Agent control.
websocket:
  message_size_limit: 1048576

health:
  enabled: true

admin:
  enabled: false

log:
  level: info

# Largest single client message. The Computer returns a Workspace File read (up to 1 MiB of text,
# packages/daemon/src/agent-runtime/agent-workspace-files.ts) in one RPC; over this limit
# Centrifugo closes the connection. 2 MiB leaves room for the envelope.
websocket:
  message_size_limit: 2097152

client:
  allowed_origins:
    - http://localhost:8788
    - http://127.0.0.1:8788
    - https://*.onamp.dev
  token:
    jwks_public_endpoint: http://host.docker.internal:8789/api/jwks
    audience: coforge-centrifugo
    issuer: coforge
  proxy:
    connect:
      enabled: true
      endpoint: http://host.docker.internal:8789/api/internal/centrifugo-connect
      timeout: 5s
      http:
        static_headers:
          X-CoForge-Centrifugo-Proxy-Secret: ${CENTRIFUGO_VAR_RPC_PROXY_SECRET}

channel:
  proxy:
    publish:
      endpoint: http://host.docker.internal:8789/api/internal/centrifugo-agent-activity
      timeout: 1s
      binary_encoding: true
      include_connection_meta: true
      http:
        static_headers:
          X-CoForge-Centrifugo-Proxy-Secret: ${CENTRIFUGO_VAR_RPC_PROXY_SECRET}
  namespaces:
    - name: workspace
    - name: daemon
    - name: chat
      history_size: 200
      history_ttl: 5m
      force_recovery: true
    - name: agent
      publish_proxy_enabled: true
      publication_data_format: binary

rpc:
  proxy:
    endpoint: http://host.docker.internal:8789/api/internal/centrifugo
    timeout: 5s
    binary_encoding: true
    include_connection_meta: true
    http:
      static_headers:
        X-CoForge-Centrifugo-Proxy-Secret: ${CENTRIFUGO_VAR_RPC_PROXY_SECRET}
  without_namespace:
    proxy_enabled: true
  namespaces:
    - name: agent
      proxy_enabled: true
    - name: computer
      proxy_enabled: true
    - name: workspace
      proxy_enabled: true
    - name: daemon
      proxy_enabled: true
