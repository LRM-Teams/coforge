syntax = "proto3";

package coforge.rpc.v1;


message TaskView {
  string message_id = 1;
  string conversation_id = 2;
  uint32 number = 3;
  string title = 4;
  string status = 5;
  uint32 revision = 6;
  TaskOwner owner = 7;
  optional string description = 8;
  optional string channel_ref = 9;
  optional bool requires_resource_receipt = 10;
  optional string resource_receipt_recorded_at = 11;
  TaskResourceReceipt resource_receipt = 12;
  optional string claimed_at = 13;
  bool description_is_null = 14;
  bool resource_receipt_recorded_at_is_null = 15;
  bool claimed_at_is_null = 16;
}

message TaskResourceReceipt {
  string object = 1;
  string purpose = 2;
  string teardown_owner = 3;
  string security_privacy = 4;
  string expiry = 5;
  string runbook = 6;
  string tracking = 7;
}
message TaskClaimResult {
  optional uint32 number = 1;
  optional string message_id = 2;
  bool success = 3;
  optional string reason = 4;
}
message TaskAssignmentReceipt {
  string message_id = 1;
  string content = 2;
  string assignee = 3;
  string state = 4;
}
message TaskResourceFollowup {
  string id = 1;
  string owner_agent_id = 2;
  string owner = 3;
  string fire_at = 4;
  string message_id = 5;
  string conversation_id = 6;
}
message TaskOwner {
  string member_id = 1;
  string kind = 2;
  string name = 3;
}

message TaskClaimConflict {
  string kind = 1;
  string conflict_scope = 2;
  repeated string blocked_actions = 3;
  repeated string unblocked_action_examples = 4;
  TaskCurrentAssignee current_assignee = 5;
  string task_status = 6;
  string claimed_at = 7;
  string observed_at = 8;
  bool current_assignee_is_null = 9;
}

message TaskCurrentAssignee {
  string type = 1;
  optional string name = 2;
  bool name_is_null = 3;
}
