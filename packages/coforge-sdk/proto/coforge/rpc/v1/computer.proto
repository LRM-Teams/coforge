syntax = "proto3";

package coforge.rpc.v1;

// The payload boundary for the user-authorized computer:register method.
message ComputerRegisterRequest {
  uint32 protocol_major = 1;
  string request_id = 2;
  string workspace_slug = 3;
  string machine_id = 4;
  string platform = 5;
  string os_version = 6;
  string computer_version = 7;
  string registration_idempotency_key = 9;
  string name = 10;
  string display_name = 11;
  reserved 8;
}

message RuntimeMetadata {
  string provider = 1;
  string version = 2;
  string display_name = 3;
}

message ComputerRegisterResponse {
  uint32 protocol_major = 1;
  string request_id = 2;
  string computer_id = 3;
  string workspace_id = 4;
  reserved 5;
  reserved "connection_id";
  string daemon_api_key = 6;
}
