syntax = "proto3";

package coforge.rpc.v1;

message LocalRpcRequest {
  string method = 1;
  bytes payload = 2;
}

message LocalRpcResponse {
  string method = 1;
  bytes payload = 2;
}

message AgentMessageRecord {
  string id = 1;
  uint64 sequence = 2;
  // Closed vocabulary: "human", "agent", "system".
  string sender_kind = 3;
  // Public handle without a leading "@"; required for "human"/"agent", empty for "system".
  string sender_handle = 4;
  // The sender's role text; empty when there is none.
  string sender_description = 5;
  string target = 6;
  string body = 7;
  string created_at = 8;
  repeated LocalAttachmentMetadata attachments = 9;
  LocalMessageTaskMetadata task = 10;
  // Present when the sender knows whether this message personally @mentioned the reading Agent.
  optional bool mentions_agent = 11;
}

message LocalAttachmentMetadata {
  string id = 1;
  string file_name = 2;
  string content_type = 3;
  uint64 size_bytes = 4;
}

message LocalMessageTaskMetadata {
  uint32 number = 1;
  string status = 2;
  LocalMessageTaskOwner owner = 3;
}

message LocalMessageTaskOwner {
  string display_name = 1;
  string handle = 2;
}

message MessageAttentionSummary {
  string target = 1;
  uint32 pending_count = 2;
  uint64 first_pending_sequence = 3;
  uint64 latest_sequence = 4;
  // Closed vocabulary: "human", "agent", "system". No description on this summary.
  optional string latest_sender_kind = 5;
  // Public handle without a leading "@".
  optional string latest_sender_handle = 6;
  repeated string flags = 7;
}

message AgentMessageResponse {
  string request_id = 1;
  // For `message send`: whether the message was sent rather than held (`state == "sent"`).
  bool accepted = 2;
  uint32 attention_count = 3;
  repeated AgentMessageRecord messages = 4;
  string message_id = 5;
  repeated MessageAttentionSummary summaries = 6;
  optional uint64 seen_up_to_sequence = 8; // Daemon-side only; never emitted to the Agent.
  bool has_older = 10;
  bool has_newer = 11;
  string older_cursor = 12;
  string newer_cursor = 13;
  string freshness_context_mode = 14;
  optional uint32 withheld_message_count = 15;
  bool has_more = 16;
  // `message send` only: the pending messages a bypassed hold chose not to review; empty otherwise.
  repeated AgentMessageRecord recent_unread = 17;
  // `message send` only, Raft's send contract: "sent" | "held".
  string state = 18;
  // `message send` only: `forward`/`bypass` for a sent message, `local_hold`/`syncing_hold` for a
  // held one.
  string decision = 19;
  string reason = 20;
  string producer_fact_id = 21;
  // Raft's `available_actions` for a held send: `check_messages`, `send_draft`, `send_anyway`.
  repeated string available_actions = 22;
  bool continue_anyway_suggested = 23;
  // `message send` only: the held context window, oldest to newest.
  repeated AgentMessageRecord held_messages = 24;
  optional uint32 new_message_count = 25;
  optional uint32 shown_message_count = 26;
  optional uint32 omitted_message_count = 27;
  reserved 7, 9;
  reserved "side_effect_decision", "anyway_allowed";
}

message LocalInboxRequest {
  string request_id = 1;
  string context = 2;
  string operation = 3;
}

message AppInboxItem {
  string item_id = 1;
  string app_id = 2;
  string notification_class = 3;
  string source_kind = 4;
  string source_id = 5;
  string source_revision = 6;
  optional string title = 7;
  optional string summary = 8;
  string retention = 9;
  string action_kind = 10;
  string action_command_id = 11;
  string created_at = 12;
}

message InboxEntry {
  oneof value {
    MessageAttentionSummary message_target = 1;
    AppInboxItem app = 2;
  }
}

message InboxResponse {
  string request_id = 1;
  bool accepted = 2;
  repeated InboxEntry entries = 3;
}

message UsageScanRequest {
  uint32 protocol_major = 1;
  string request_id = 2;
  string provider = 3;
}

message UsageScanResponse {
  uint32 protocol_major = 1;
  string request_id = 2;
  bool accepted = 3;
  string status = 4;
  string message = 5;
  bytes snapshot_json = 6;
}

// Runner hold. Sent Coordinator -> Workspace daemon before an upgrade stops the
// supervisor, so Agents stop admitting new turns and in-flight tool calls get a
// bounded grace period instead of the ~2s SIGTERM/SIGKILL ladder. Additive:
// protocol_major stays 1.
message DaemonHoldRequest {
  uint32 protocol_major = 1;
  string request_id = 2;
  string expected_server_url = 3;
  // Diagnostic only; never used for control flow.
  string reason = 4;
}

// One Agent whose last emitted Activity is still a busy detail kind.
message HeldBusyAgent {
  string workspace_id = 1;
  string agent_id = 2;
  string detail_kind = 3;
  uint64 busy_since_ms = 4;
}

message DaemonHoldResponse {
  uint32 protocol_major = 1;
  string request_id = 2;
  bool accepted = 3;
  // True while the hold is in force; false once released.
  bool held = 4;
  repeated HeldBusyAgent busy_agents = 5;
  // Workspaces that did not answer within the per-Workspace hold budget. A
  // Coordinator reports them rather than blocking the upgrade on them.
  repeated string unreachable_workspace_ids = 6;
}
