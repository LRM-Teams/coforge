syntax = "proto3";

package coforge.rpc.v1;

message WorkspaceListRequest {
  uint32 protocol_major = 1;
  string request_id = 2;
  string workspace_slug = 3;
}

message WorkspaceGetRequest {
  uint32 protocol_major = 1;
  string request_id = 2;
  string workspace_slug = 3;
}

message WorkspaceListResponse {
  uint32 protocol_major = 1;
  string request_id = 2;
  repeated Workspace workspaces = 3;
}

message WorkspaceGetResponse {
  uint32 protocol_major = 1;
  string request_id = 2;
  Workspace workspace = 3;
}

message WorkspaceInfoRequest {
  uint32 protocol_major = 1;
  string request_id = 2;
}
message WorkspaceInfoResponse {
  uint32 protocol_major = 1;
  string request_id = 2;
  Workspace workspace = 3;
  repeated WorkspaceInfoHuman humans = 4;
  repeated WorkspaceInfoProject projects = 5;
  repeated WorkspaceInfoAgent agents = 6;
}
message WorkspaceInfoHuman {
  string id = 1;
  string name = 2;
  string display_name = 3;
  string role = 4;
}
message WorkspaceInfoAgent {
  string id = 1;
  string name = 2;
  string display_name = 3;
  string role = 4;
  string status = 5;
  string activity = 6;
  string activity_detail = 7;
  string runtime = 8;
  string model = 9;
  string computer_name = 10;
  string daemon_version = 11;
}
message WorkspaceInfoProject {
  string id = 1;
  string name = 2;
  string slug = 3;
  string github_full_name = 4;
  string github_html_url = 5;
}

message Workspace {
  string id = 1;
  string slug = 2;
  string name = 3;
}

// Acknowledged daemon-to-cloud identity report; never delivered as Activity.
message AgentSessionReport {
  uint32 protocol_major = 1;
  string request_id = 2;
  string workspace_id = 3;
  string computer_id = 4;
  string agent_id = 5;
  string provider = 6;
  string session_id = 7;
  string start_request_id = 8;
  string daemon_instance_id = 9;
  string launch_id = 10;
  optional string previous_launch_id = 11;
  optional string replaced_session_id = 12;
  optional uint32 control_epoch = 13;
  optional uint32 sequence = 14;
  optional string session_state = 15;
}

// Fire-and-forget daemon-to-cloud notice that a stored native Session is gone
// or was rejected on replay; the daemon is cold-starting without it. Never
// delivered as Activity. `reason` is "missing" or "provider_replay_rejected".
// No control-fence fields (no start_request_id/control_epoch, unlike
// AgentSessionReport): the server's exact match is on launch_id + session_id
// alone. This message never shipped, so its fields are numbered
// contiguously rather than reserving the two removed tags.
message AgentSessionInvalidate {
  uint32 protocol_major = 1;
  string request_id = 2;
  string workspace_id = 3;
  string computer_id = 4;
  string agent_id = 5;
  string provider = 6;
  string session_id = 7;
  string daemon_instance_id = 8;
  string launch_id = 9;
  string reason = 10;
}

// Fire-and-forget daemon-to-cloud notice of the Agent's current context-window usage, observed
// at the top-level Claude Code `result` record. Claude Code only for now; a provider
// with no such signal never emits it. Never delivered as Activity. This message never shipped,
// so its fields are numbered contiguously.
message AgentContextUsage {
  uint32 protocol_major = 1;
  string request_id = 2;
  string workspace_id = 3;
  string computer_id = 4;
  string agent_id = 5;
  string provider = 6;
  string launch_id = 7;
  string session_id = 8;
  uint64 used_tokens = 9;
  uint64 window_tokens = 10;
  uint64 observed_at_ms = 11;
  string daemon_instance_id = 12;
  uint64 client_seq = 13;
}

// Versioned server-to-daemon intent.
message AgentStartIntent {
  uint32 protocol_major = 1;
  string request_id = 2;
  string workspace_id = 3;
  string agent_id = 4;
  string provider = 5;
  string model = 6;
  string reasoning = 7;
  string session_id = 8;
  string computer_id = 9;
  string model_provider = 10;
  // Explicit envelope discriminator; never infer message type from payload fields.
  string message_type = 11;
  AgentRuntimeProviderConfig provider_config = 12;
  AgentRecoveryMessage wake_message = 13;
  repeated AgentRecoveryMessage resume_messages = 14;
  repeated AgentUnreadSummaryEntry unread_summary = 15;
  optional string previous_launch_id = 16;
  optional string session_mode = 17;
  optional uint32 control_epoch = 18;
  // The server mints one launchId per control operation's start step
  // (`AgentControlState.launchId`) and supplies it here; the daemon adopts it
  // for the launch it makes (or, on a Start that meets an already-running
  // process, for the rebind that keeps that process). Required whenever
  // control_epoch is set (every managed start); absent only for an unmanaged
  // start, which this wire message no longer expects from a current server.
  optional string launch_id = 19;
  // Text the Agent's first turn opens with, in place of message recovery: the
  // guidance a user gives when resuming Agents they stopped.
  // Never carried together with wake_message, resume_messages or unread_summary.
  optional string resume_prompt = 20;
}

// Versioned server-to-daemon stop intent. A replacement is expressed as a
// separate AgentStopIntent followed by AgentStartIntent.
message AgentStopIntent {
  uint32 protocol_major = 1;
  string request_id = 2;
  string workspace_id = 3;
  string agent_id = 4;
  string computer_id = 5;
  string message_type = 6;
  optional string provider = 7;
  optional uint32 control_epoch = 8;
}

message AgentRecoveryMessage {
  string message_id = 1;
  string delivery_id = 2;
  string conversation_id = 3;
  uint64 sequence = 4;
  string target = 5;
  // Closed vocabulary: "human", "agent", "system".
  string latest_sender_kind = 6;
  // Public handle without a leading "@"; required for "human"/"agent", empty for "system".
  string latest_sender_handle = 7;
  // The sender's role text; empty when there is none.
  string latest_sender_description = 8;
  string body = 9;
}

message AgentUnreadSummaryEntry {
  string target = 1;
  uint32 count = 2;
}

message AgentRuntimeProviderConfig {
  string kind = 1;
  string provider_id = 2;
}

// Versioned server-to-daemon liveness probe. The daemon answers with an
// ordinary AgentActivity carrying the same probe_id.
message AgentActivityProbe {
  uint32 protocol_major = 1;
  string request_id = 2;
  string workspace_id = 3;
  string computer_id = 4;
  string agent_id = 5;
  string probe_id = 6;
  // Explicit envelope discriminator; never infer message type from payload fields.
  string message_type = 7;
}

// Versioned server-to-daemon notice that an Agent can no longer read some
// channels: the daemon drops, and acknowledges, its local state for them. No reply.
message AgentInboxPurge {
  uint32 protocol_major = 1;
  string request_id = 2;
  string workspace_id = 3;
  string computer_id = 4;
  string agent_id = 5;
  // The channel conversations; their threads are included.
  repeated string conversation_ids = 6;
  // The same channels as targets ("#name"), for state the daemon keys by target.
  repeated string targets = 7;
  // Why access ended: "member_removed", "left", or "visibility_private".
  string reason = 8;
  // Explicit envelope discriminator; never infer message type from payload fields.
  string message_type = 9;
}

// Versioned server-to-daemon canonical direct message delivery.
message AgentMessageDelivery {
  uint32 protocol_major = 1;
  string request_id = 2;
  string message_id = 3;
  string workspace_id = 4;
  string conversation_id = 5;
  string agent_id = 6;
  string body = 7;
  string method = 8;
  string delivery_id = 9;
  uint64 sequence = 10;
  // Public target identity; never expose internal agent/user ids to Agents.
  string target = 11;
  // Closed vocabulary: "human", "agent", "system".
  string latest_sender_kind = 12;
  // Public handle without a leading "@"; required for "human"/"agent", empty for "system".
  string latest_sender_handle = 13;
  // The sender's role text; empty when there is none.
  string latest_sender_description = 14;
  // Present when the sender knows whether this delivery personally @mentioned the recipient Agent.
  optional bool mentions_agent = 15;
}

message AgentMessageDeliveryAck {
  uint32 protocol_major = 1;
  string request_id = 2;
  string delivery_id = 3;
  string message_id = 4;
  string workspace_id = 5;
  string agent_id = 6;
  uint64 sequence = 7;
  string method = 8;
}

// Versioned daemon-to-server Agent activity. Agent status remains a separate
// concern in the daemon/runtime contract; this payload carries activity data.
message AgentActivity {
  uint32 protocol_major = 1;
  string request_id = 2;
  string workspace_id = 3;
  string agent_id = 4;
  string detail_kind = 5;
  string level = 6;
  string detail = 7;
  uint64 observed_at_ms = 8;
  string message_id = 9;
  string conversation_id = 10;
  string launch_id = 11;
  uint64 client_seq = 12;
  string runtime_error_class = 13;
  string runtime_error_reason = 14;
  string runtime_error_fingerprint = 15;
  repeated ActivityTrajectoryEntry entries = 16;
  optional string activity_kind = 17;
  // True when this frame re-sends the last busy activity to renew the
  // display lease during a long silent turn; carries no new content.
  bool is_heartbeat = 18;
  // Set only on the daemon's reply to an AgentActivityProbe; echoes its probe_id.
  string probe_id = 19;
  // Raft's freshness-decision lineage: `freshness_decision_fact:<sha256>` for the decision this
  // row narrates (`buildApmFreshnessDecisionProducerFactId`). Set on a freshness-hold row only;
  // empty otherwise.
  string producer_fact_id = 20;
}

// Display-only trajectory. The oneof makes kind/payload mismatches impossible.
message ActivityTrajectoryEntry {
  oneof content {
    string text = 1;
    string thinking = 2;
    string tool_name = 3;
    // The daemon injected a system/control message into the Agent's session.
    ActivitySystemEntry system = 5;
  }
  string parent_tool_use_id = 4;
  // `tool_name` only: the short, already-redacted argument summary. The
  // activity's own `detail` is only the generic tool label.
  string tool_input = 6;
}

// A daemon-injected system/control message shown as its own trajectory row.
message ActivitySystemEntry {
  string title = 1;
  string text = 2;
}

// Versioned daemon-to-server Agent availability transition.
message AgentStatus {
  uint32 protocol_major = 1;
  string request_id = 2;
  string workspace_id = 3;
  string computer_id = 4;
  string agent_id = 5;
  string status = 6;
  string daemon_instance_id = 7;
  uint64 client_seq = 8;
  uint64 observed_at_ms = 9;
}
