syntax = "proto3";

package coforge.rpc.v1;

message AgentSkillsListRequest {
  uint32 protocol_major = 1;
  string request_id = 2;
  string workspace_id = 3;
  string computer_id = 4;
  string agent_id = 5;
  string provider = 6;
  string message_type = 7;
}

message AgentSkillsListResult {
  uint32 protocol_major = 1;
  string request_id = 2;
  string workspace_id = 3;
  string computer_id = 4;
  string agent_id = 5;
  string provider = 6;
  string message_type = 7;
  uint64 scanned_at_ms = 8;
  AgentSkillsScope global = 9;
  AgentSkillsScope workspace = 10;
}

message AgentSkillsScope {
  string status = 1;
  repeated AgentSkillMetadata entries = 2;
  repeated AgentSkillsDirectory directories = 3;
}

message AgentSkillMetadata {
  string name = 1;
  string description = 2;
  string source_path = 3;
}

message AgentSkillsDirectory {
  string path = 1;
  string status = 2;
}
