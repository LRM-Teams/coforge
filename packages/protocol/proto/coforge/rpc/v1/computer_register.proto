syntax = "proto3";

package coforge.rpc.v1;

// The payload boundary for the user-authorized computer:register method.
message ComputerRegisterRequest {
  uint32 protocol_major = 1;
  string request_id = 2;
  string workspace_slug = 3;
  string machine_id = 4;
  string platform = 5;
  string os_version = 6;
  string computer_version = 7;
  repeated RuntimeMetadata runtimes = 8;
  string registration_idempotency_key = 9;
}

message RuntimeMetadata {
  // Field 1 is wire-compatible with the former `name` field. The JSON/proto
  // field name is intentionally now `provider`; clients must not use `name`.
  string provider = 1;
  string version = 2;
  reserved 3;
  reserved "capabilities";
  RuntimeKind kind = 4;
}

// Zero is treated as external by the TypeScript codec for compatibility with
// payloads produced before kind was introduced. New payloads use the explicit
// external value so external and unspecified remain distinct on the wire.
enum RuntimeKind {
  RUNTIME_KIND_UNSPECIFIED = 0;
  RUNTIME_KIND_BUILTIN = 1;
  RUNTIME_KIND_EXTERNAL = 2;
}

message ComputerRegisterResponse {
  uint32 protocol_major = 1;
  string request_id = 2;
  string computer_id = 3;
  string workspace_id = 4;
  reserved 5;
  reserved "connection_id";
  string workspace_worker_token = 6;
}

message DaemonHandshakeRequest {
  uint32 protocol_major = 1;
  string request_id = 2;
}

message DaemonHandshakeResponse {
  uint32 protocol_major = 1;
  string request_id = 2;
  string daemon_id = 3;
  bool accepted = 4;
}

message WorkspaceWorkerConfigureRequest {
  uint32 protocol_major = 1;
  string request_id = 2;
  string workspace_id = 3;
  reserved 4;
  reserved "connection_id";
  string workspace_root = 5;
  string workspace_worker_token = 6;
  string computer_id = 7;
}

message WorkspaceWorkerConfigureResponse {
  uint32 protocol_major = 1;
  string request_id = 2;
  bool accepted = 3;
}

message DaemonCommandRequest {
  uint32 protocol_major = 1;
  string request_id = 2;
}

message DaemonCommandResponse {
  uint32 protocol_major = 1;
  string request_id = 2;
  bool accepted = 3;
}

message WorkspaceWorkerReadyRequest {
  uint32 protocol_major = 1;
  string request_id = 2;
  string workspace_id = 3;
  string computer_id = 4;
  string worker_instance_id = 5;
  int64 started_at = 6;
}

message WorkspaceWorkerCodeAgentsUpdateRequest {
  uint32 protocol_major = 1;
  string request_id = 2;
  string workspace_id = 3;
  string computer_id = 4;
  repeated RuntimeMetadata runtimes = 5;
  repeated CodeAgentModelCatalog catalogs = 6;
}

message CodeAgentModelCatalog {
  string provider = 1;
  repeated CodeAgentModelMetadata models = 2;
}

message CodeAgentModelMetadata {
  string id = 1;
  string display_name = 2;
  string description = 3;
  string model_provider = 4;
  repeated string reasoning_efforts = 5;
  string default_reasoning = 6;
  bool recommended = 7;
}

message LocalRpcRequest {
  string method = 1;
  bytes payload = 2;
}

message LocalRpcResponse {
  string method = 1;
  bytes payload = 2;
}

message LocalAgentMessageRequest {
  string request_id = 1;
  string context = 2;
  string operation = 3;
  string target = 4;
  string body = 5;
}

message AgentMessageRecord {
  string id = 1;
  uint64 sequence = 2;
  string sender = 3;
  string target = 4;
  string body = 5;
  string created_at = 6;
}

message MessageAttentionSummary {
  string target = 1;
  uint32 pending_count = 2;
  uint64 first_pending_sequence = 3;
  uint64 latest_sequence = 4;
  optional string latest_sender = 5;
  repeated string flags = 6;
}

message AgentMessageResponse {
  string request_id = 1;
  bool accepted = 2;
  uint32 attention_count = 3;
  repeated AgentMessageRecord messages = 4;
  string message_id = 5;
  repeated MessageAttentionSummary summaries = 6;
}
