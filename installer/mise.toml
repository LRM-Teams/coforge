# The Rust toolchain for the installer crate only. It lives here rather than in the root
# mise.toml so the root `mise install` (every CI job, .agents/setup) never downloads a Rust
# toolchain, and because mise's core Rust backend locks no per-platform URLs, which
# scripts/ci/toolchain.test.ts requires of every root tool. From this directory mise merges
# this file with the root one. Version: stable per
# https://static.rust-lang.org/dist/channel-rust-stable.toml (2026-09-03, rust 1.98.1).
# Syntax: https://mise.jdx.dev/lang/rust.html
[tools]
rust = { version = "1.98.1", profile = "minimal", components = ["rustfmt", "clippy"] }
