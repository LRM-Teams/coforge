# Tools for the installer crate only. They live here rather than in the root mise.toml so the
# root `mise install` (every CI job, .agents/setup) never downloads a Rust toolchain. From this
# directory mise merges this file with the root one, so install only the tools you need
# (`mise install rust`). Syntax: https://mise.jdx.dev/lang/rust.html
#
# rust: stable per https://static.rust-lang.org/dist/channel-rust-stable.toml (2026-09-03,
#   rust 1.98.1). mise's core Rust backend locks no download URL; rustup verifies the toolchain.
# cargo-deny, cargo-audit, cargo-about: the supply-chain gate CI runs on linux-x64, from each
#   project's own GitHub release binaries (latest releases as of 2026-09-29), with the URL and
#   checksum per platform in mise.lock:
#   https://github.com/EmbarkStudios/cargo-deny/releases/tag/0.20.2
#   https://github.com/rustsec/rustsec/releases/tag/cargo-audit%2Fv0.22.2
#   https://github.com/EmbarkStudios/cargo-about/releases/tag/0.9.2
[tools]
rust = { version = "1.98.1", profile = "minimal", components = ["rustfmt", "clippy"] }
cargo-deny = "0.20.2"
"github:rustsec/rustsec" = { version = "0.22.2", version_prefix = "cargo-audit/v" }
"github:EmbarkStudios/cargo-about" = "0.9.2"
