# cargo-deny policy for the installer crate: `cargo deny check licenses bans sources advisories`.
# Field reference: https://embarkstudios.github.io/cargo-deny/checks/cfg.html (cargo-deny 0.20.2)

[graph]
# The six release targets. Dependencies behind a cfg() that matches none of them are ignored.
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "x86_64-unknown-linux-musl",
  "aarch64-unknown-linux-musl",
  "x86_64-pc-windows-msvc",
  "aarch64-pc-windows-msvc",
]

[advisories]
# Every vulnerability advisory is an error. Unmaintained and unsound advisories fail for the
# whole graph, not only direct dependencies; yanked versions fail too.
yanked = "deny"
unmaintained = "all"
unsound = "all"

[licenses]
# Licenses that can be shipped in the binary with THIRD_PARTY_NOTICES.txt. Anything else is
# denied; widening this list is a licensing decision for Frank, not a CI fix.
allow = [
  "Apache-2.0",
  "BSD-3-Clause",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "Unicode-3.0",
]

# The crate itself declares no license (publish = false); the repository has none either.
[licenses.private]
ignore = true

[bans]
multiple-versions = "deny"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
