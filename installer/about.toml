# cargo-about configuration for THIRD_PARTY_NOTICES.txt, which CI generates from
# about/notices.hbs and keeps as a build artifact; the output is not committed.
# Field reference: https://github.com/EmbarkStudios/cargo-about/blob/0.9.2/docs/src/cli/generate/config.md

# Priority order used to satisfy each crate's license expression. deny.toml's [licenses] allow
# list is the gate; keep this list in step with it.
accepted = [
  "MIT",
  "Apache-2.0",
  "ISC",
  "BSD-3-Clause",
  "Unicode-3.0",
  "CDLA-Permissive-2.0",
]

# The six release targets, as in deny.toml.
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "x86_64-unknown-linux-musl",
  "aarch64-unknown-linux-musl",
  "x86_64-pc-windows-msvc",
  "aarch64-pc-windows-msvc",
]

# Test-only crates never reach the binary.
ignore-dev-dependencies = true

# The crate itself declares no license (publish = false).
private = { ignore = true }
