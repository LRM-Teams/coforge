name: Publish Computer (staging)
run-name: Publish Computer ${{ inputs.version || format('0.1.0-dev.{0}', github.run_number) }} to staging

# Publishing a local Computer distribution is manual, never automatic on a push to main - see
# docs/release.md's "Local Computer distribution model": a client release leaves a persistent
# artifact set behind, unlike the cloud application track's replace-a-running-service model, so a
# build per merge is waste. Do not add a `push:` trigger here.
on:
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Release version to publish (e.g. 0.1.0). Leave empty to auto-generate a
          0.1.0-dev.<run number> version for this run.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-staging
  cancel-in-progress: false

jobs:
  gates:
    name: Validate
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml
    with:
      track: local

  publish:
    name: Build and publish Computer
    # macos-15-intel (x64), not ubuntu-latest, on purpose - and it is a network experiment, not a
    # preference. Every staging publish since dev.59 stalls its *first* OSS upload on an established
    # keep-alive socket (2 MiB in 120 s: under 17 KB/s, `ResponseTimeoutError`, no HTTP status), while
    # the same script and the same ali-oss version published dev.58 fine 25 minutes earlier. Part size,
    # timeouts, retries, artifact volume and the manual are all measured out (see the PR body); what is
    # left is the runner's egress to oss-cn-beijing. A different runner image is a different network
    # path, and the six targets cross-compile from any host, so this changes exactly one variable.
    needs: gates
    runs-on: macos-15-intel
    environment: staging
    # `id-token: write` lets this job mint the GitHub OIDC token it exchanges for the Alibaba
    # Cloud STS credential below; the validation job does not need it.
    permissions:
      contents: read
      id-token: write
    # Uploads have no per-request timeout since #598, and the runner-to-OSS link is measured at
    # <=17.5 KB/s: 186 MB needs ~3 h single-job (dev.67 was killed at exactly this 30-minute cap).
    # The split per-platform matrix (#597) makes this generous again; until it lands, give the
    # single job a whole-day ceiling so a slow link finishes instead of dying mid-upload.
    timeout-minutes: 1440
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: "2026.9.2"
          install: false

      - name: Install toolchain
        run: mise install

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate protocol sources
        run: bun run --cwd packages/coforge-sdk generate

      - name: Select release version
        id: version
        # inputs.version and github.run_number are interpolated into env vars, not directly into
        # the shell script body: a workflow_dispatch string input is caller-controlled, and
        # substituting it inline here would let its literal text be interpreted as shell syntax
        # before isValidReleaseVersion ever gets a chance to reject it in publish.ts.
        env:
          INPUT_VERSION: ${{ inputs.version }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          version="$INPUT_VERSION"
          if [ -z "$version" ]; then
            # Manual staging builds use the target release plus a unique workflow run number.
            # Source identity remains in the manifest's commit field.
            version="0.1.0-dev.${RUN_NUMBER}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Request an OIDC token for Alibaba Cloud
        env:
          AUDIENCE: sts.aliyuncs.com
        run: |
          token_file="$RUNNER_TEMP/aliyun-oidc-token"
          curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUDIENCE" \
            | jq -r '.value' > "$token_file"
          chmod 600 "$token_file"
          echo "ALIBABA_CLOUD_OIDC_TOKEN_FILE=$token_file" >> "$GITHUB_ENV"
          # The RAM role's trust policy matches these three claims exactly; print them so a
          # trust-policy mismatch is diagnosable from the run log. The payload is public run
          # metadata; the signature (the only secret part) is never printed.
          payload="$(cut -d. -f2 "$token_file" | tr '_-' '/+' | awk '{ n = length($0) % 4; if (n) $0 = $0 substr("==", 1, 4 - n); print }' | base64 -d)"
          printf 'OIDC claims: %s\n' "$(printf '%s' "$payload" | jq -c '{iss, aud, sub, exp}')"

      # This role's trust policy grants only `repo:LRM-Teams@289986103/coforge@1345850229:environment:staging` -
      # GitHub's OIDC token asserts the workflow's repo/ref/environment, and Alibaba Cloud checks
      # that assertion before issuing an STS token. No long-term AccessKey exists for this
      # publisher; a compromised token can only assume the role from this exact repo/environment,
      # and it expires with the run.
      - name: Build six platforms, upload, and verify release
        env:
          ALIBABA_CLOUD_ROLE_ARN: acs:ram::1085194890307801:role/coforge-release-publisher
          ALIBABA_CLOUD_OIDC_PROVIDER_ARN: acs:ram::1085194890307801:oidc-provider/github-actions
          ALIBABA_CLOUD_ROLE_SESSION_NAME: github-actions-${{ github.run_id }}
          # The credential chain would otherwise fall through to the ECS metadata service and a
          # credentials URI after an OIDC failure, spending minutes on connection timeouts before
          # reporting the real error.
          ALIBABA_CLOUD_ECS_METADATA_DISABLED: "true"
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          bun scripts/release/publish.ts \
            --version "$RELEASE_VERSION" \
            --commit "$RELEASE_COMMIT" \
            --feed-url "https://releases-staging.coforge.cn"

      - name: Summarize published release
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          {
            echo "## Computer published to staging"
            echo ""
            echo "- Version: ${RELEASE_VERSION}"
            echo "- Source commit: ${RELEASE_COMMIT}"
            echo "- Platforms: Linux, macOS, Windows (x64 and arm64)"
            echo "- Verified: uploaded bytes, checksums, private storage access, and latest version selector"
            echo "- CDN delivery and complete install/upgrade/rollback acceptance are separate checks."
          } >> "$GITHUB_STEP_SUMMARY"
