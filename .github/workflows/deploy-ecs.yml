name: Build and deploy realtime gateway

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: deploy-test
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/lrm-teams/coforge-realtime-gateway

jobs:
  build:
    name: Test, build, and publish image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      image_ref: ${{ steps.release.outputs.image_ref }}

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install pinned toolchain
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4

      - name: Install dependencies
        run: mise run install

      - name: Test
        run: mise run test

      - name: Check
        run: mise run check

      - name: Build
        run: mise run build

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push immutable image
        id: push
        uses: docker/build-push-action@f2a1d5e99d037542a71f64918e516c093c6f3fc4
        with:
          context: apps/realtime-gateway
          file: apps/realtime-gateway/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Record immutable release reference
        id: release
        env:
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          if [[ ! "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo 'build did not return an immutable sha256 digest' >&2
            exit 1
          fi
          image_ref="$IMAGE_NAME@$IMAGE_DIGEST"
          echo "image_ref=$image_ref" >>"$GITHUB_OUTPUT"
          printf '%s\n' "$image_ref" >"$RUNNER_TEMP/release-image.txt"
          # shellcheck disable=SC2016
          printf '### Test release image\n\n`%s`\n' "$image_ref" >>"$GITHUB_STEP_SUMMARY"

      - name: Upload immutable release descriptor
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: realtime-gateway-release-${{ github.sha }}
          path: ${{ runner.temp }}/release-image.txt
          if-no-files-found: error
          retention-days: 30

  deploy:
    name: Deploy and verify test
    needs: build
    runs-on:
      group: coforge-deploy
      labels: coforge-test-deploy
    timeout-minutes: 10
    environment: test
    permissions:
      contents: read
      packages: read

    steps:
      - name: Check out deployment files
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install pinned deployment toolchain
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4

      - name: Validate deployment inputs
        env:
          ECS_EDGE_BIND_IP: ${{ vars.ECS_EDGE_BIND_IP }}
          ECS_SHARED_INGRESS_HEALTH_PATH: ${{ vars.ECS_SHARED_INGRESS_HEALTH_PATH }}
          ECS_HOST: ${{ vars.ECS_HOST }}
          ECS_SSH_USER: ${{ secrets.ECS_SSH_USER }}
        run: |
          validate_ipv4() {
            local value=$1
            if [[ ! "$value" =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}$ ]]; then
              return 1
            fi
            local octet
            IFS=. read -r -a octets <<<"$value"
            for octet in "${octets[@]}"; do
              if ((10#$octet > 255)); then
                return 1
              fi
            done
          }

          validate_private_ipv4() {
            validate_ipv4 "$1" || return 1
            local first second
            IFS=. read -r first second _ <<<"$1"
            ((10#$first == 10 \
              || 10#$first == 127 \
              || (10#$first == 192 && 10#$second == 168) \
              || (10#$first == 172 && 10#$second >= 16 && 10#$second <= 31)))
          }

          if ! python3 - "$ECS_HOST" <<'PY'
          import ipaddress
          import sys

          address = ipaddress.ip_address(sys.argv[1])
          if address.version != 4 or not address.is_global:
              raise SystemExit(1)
          PY
          then
            echo 'ECS_HOST must be a globally routable public IPv4 address' >&2
            exit 1
          fi
          if ! validate_private_ipv4 "$ECS_EDGE_BIND_IP"; then
            echo 'ECS_EDGE_BIND_IP must be a private or loopback IPv4 address' >&2
            exit 1
          fi
          if [[ "$ECS_SSH_USER" != deploy ]]; then
            echo 'ECS_SSH_USER must be the dedicated deploy account' >&2
            exit 1
          fi
          if [[ ! "$ECS_SHARED_INGRESS_HEALTH_PATH" =~ ^/[^[:space:]]*$ ]] \
            || [[ "$ECS_SHARED_INGRESS_HEALTH_PATH" == /coforge* ]]; then
            echo 'ECS_SHARED_INGRESS_HEALTH_PATH must name an existing non-CoForge HTTPS route' >&2
            exit 1
          fi

      - name: Configure pinned SSH identity
        env:
          ECS_HOST: ${{ vars.ECS_HOST }}
          ECS_SSH_HOST_KEY: ${{ secrets.ECS_SSH_HOST_KEY }}
          ECS_SSH_PRIVATE_KEY: ${{ secrets.ECS_SSH_PRIVATE_KEY }}
          ECS_SSH_USER: ${{ secrets.ECS_SSH_USER }}
        run: |
          install -d -m 0700 "$RUNNER_TEMP/ssh"
          printf '%s\n' "$ECS_SSH_PRIVATE_KEY" >"$RUNNER_TEMP/ssh/deploy_key"
          printf '%s\n' "$ECS_SSH_HOST_KEY" >"$RUNNER_TEMP/ssh/known_hosts"
          chmod 0600 "$RUNNER_TEMP/ssh/deploy_key" "$RUNNER_TEMP/ssh/known_hosts"
          ssh-keygen -F "$ECS_HOST" -f "$RUNNER_TEMP/ssh/known_hosts" >/dev/null
          cat >"$RUNNER_TEMP/ssh/config" <<EOF
          Host coforge-ecs
            HostName $ECS_HOST
            User $ECS_SSH_USER
            IdentityFile $RUNNER_TEMP/ssh/deploy_key
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            UserKnownHostsFile $RUNNER_TEMP/ssh/known_hosts
          EOF
          chmod 0600 "$RUNNER_TEMP/ssh/config"

      - name: Upload Compose release definition
        env:
          REMOTE_STAGE: /tmp/coforge-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          ssh -F "$RUNNER_TEMP/ssh/config" coforge-ecs \
            "test \"\$(id -u)\" -ne 0 && test \"\$(id -un)\" = deploy \
              && install -d -m 0700 '$REMOTE_STAGE'"
          scp -F "$RUNNER_TEMP/ssh/config" \
            deploy/ecs/compose.yaml \
            scripts/deploy/compose_release.sh \
            "coforge-ecs:$REMOTE_STAGE/"
          ssh -F "$RUNNER_TEMP/ssh/config" coforge-ecs \
            "install -d -m 0700 .local/share/coforge/realtime-gateway \
              && install -m 0700 '$REMOTE_STAGE/compose_release.sh' \
                .local/share/coforge/realtime-gateway/compose_release.sh"

      - name: Recover prior interrupted release before deployment
        env:
          ECS_EDGE_BIND_IP: ${{ vars.ECS_EDGE_BIND_IP }}
          ECS_HOST: ${{ vars.ECS_HOST }}
          ECS_SHARED_INGRESS_HEALTH_PATH: ${{ vars.ECS_SHARED_INGRESS_HEALTH_PATH }}
          IMAGE_REF: ${{ needs.build.outputs.image_ref }}
          TRANSACTION_OWNER: ${{ github.run_id }}-${{ github.run_attempt }}
        run: scripts/deploy/recover_release.sh

      - name: Log deployment user in to GHCR
        env:
          GHCR_PULL_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_PULL_USERNAME: ${{ github.actor }}
        run: |
          printf '%s' "$GHCR_PULL_TOKEN" | \
            ssh -F "$RUNNER_TEMP/ssh/config" coforge-ecs \
              "export XDG_RUNTIME_DIR=/run/user/\$(id -u) \
                && export DOCKER_HOST=unix://\$XDG_RUNTIME_DIR/docker.sock \
                && docker info --format '{{json .SecurityOptions}}' | grep -Fq 'name=rootless' \
                && \
                docker login ghcr.io --username '$GHCR_PULL_USERNAME' --password-stdin"

      - name: Prepare image transaction
        id: prepare
        continue-on-error: true
        env:
          ECS_EDGE_BIND_IP: ${{ vars.ECS_EDGE_BIND_IP }}
          IMAGE_REF: ${{ needs.build.outputs.image_ref }}
          REMOTE_STAGE: /tmp/coforge-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          ssh -F "$RUNNER_TEMP/ssh/config" coforge-ecs \
            "bash -s -- '$IMAGE_REF' '$ECS_EDGE_BIND_IP' '$REMOTE_STAGE'" <<'REMOTE'
          set -euo pipefail
          image_ref=$1
          edge_bind_ip=$2
          remote_stage=$3
          if [[ $(id -u) -eq 0 ]]; then
            echo 'refusing to deploy as root' >&2
            exit 77
          fi
          app_root="$HOME/.local/share/coforge/realtime-gateway"
          install -d -m 0700 "$app_root"
          install -m 0700 "$remote_stage/compose_release.sh" "$app_root/compose_release.sh"
          COFORGE_EDGE_BIND_IP="$edge_bind_ip" \
            COFORGE_CANDIDATE_COMPOSE="$remote_stage/compose.yaml" \
            COFORGE_DEFER_COMMIT=true \
            COFORGE_SOURCE_COMMIT='${{ github.sha }}' \
            COFORGE_WORKFLOW_RUN='${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}' \
            COFORGE_EXECUTOR=github-actions \
            COFORGE_TRANSACTION_OWNER='${{ github.run_id }}-${{ github.run_attempt }}' \
            "$app_root/compose_release.sh" "$image_ref"
          REMOTE

      - name: Verify release transaction and commit
        id: release_transaction
        env:
          ECS_EDGE_BIND_IP: ${{ vars.ECS_EDGE_BIND_IP }}
          ECS_SHARED_INGRESS_HEALTH_PATH: ${{ vars.ECS_SHARED_INGRESS_HEALTH_PATH }}
          ECS_HOST: ${{ vars.ECS_HOST }}
          IMAGE_REF: ${{ needs.build.outputs.image_ref }}
          PREPARE_OUTCOME: ${{ steps.prepare.outcome }}
          TRANSACTION_OWNER: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          verify_https() {
            curl \
              --fail \
              --silent \
              --show-error \
              --noproxy '*' \
              --proto '=https' \
              --tlsv1.2 \
              --connect-timeout 5 \
              --max-time 20 \
              --retry 5 \
              --retry-all-errors \
              --retry-delay 2 \
              "$1" >/dev/null
          }

          verify_wss() {
            python3 scripts/deploy/wss_smoke.py "$1" --timeout 10
          }

          running_image() {
            local expected_image=$1
            ssh -F "$RUNNER_TEMP/ssh/config" coforge-ecs \
              "export XDG_RUNTIME_DIR=/run/user/\$(id -u); \
                export DOCKER_HOST=unix://\$XDG_RUNTIME_DIR/docker.sock; \
                app_root=\$HOME/.local/share/coforge/realtime-gateway; \
                container=\$(COFORGE_GATEWAY_IMAGE='$expected_image' docker compose \
                  --project-name coforge-test --file \"\$app_root/compose.yaml\" \
                  ps --quiet gateway); \
                test -n \"\$container\"; \
                docker inspect --format '{{.Config.Image}}' \"\$container\""
          }

          compose_project_empty() {
            local containers
            containers=$(ssh -F "$RUNNER_TEMP/ssh/config" coforge-ecs \
              "export XDG_RUNTIME_DIR=/run/user/\$(id -u); \
                export DOCKER_HOST=unix://\$XDG_RUNTIME_DIR/docker.sock; \
                COFORGE_GATEWAY_IMAGE='$IMAGE_REF' docker compose \
                --project-name coforge-test \
                --file \$HOME/.local/share/coforge/realtime-gateway/compose.yaml \
                ps --all --quiet") || return
            [[ -z "$containers" ]]
          }

          record_failed_rollback() {
            ssh -F "$RUNNER_TEMP/ssh/config" coforge-ecs \
              "COFORGE_TRANSACTION_OWNER='$TRANSACTION_OWNER' \
                \$HOME/.local/share/coforge/realtime-gateway/compose_release.sh \
                --record-failed-rollback"
          }

          commit_release() {
            ssh -F "$RUNNER_TEMP/ssh/config" coforge-ecs \
              "COFORGE_PUBLIC_HEALTH_RESULT=passed \
                COFORGE_SHARED_INGRESS_HEALTH_RESULT=passed \
                COFORGE_WSS_HEALTH_RESULT=passed \
                COFORGE_TCP80_RESULT=passed \
                COFORGE_RUNNING_DIGEST_RESULT=passed \
                COFORGE_TRANSACTION_OWNER='$TRANSACTION_OWNER' \
                \$HOME/.local/share/coforge/realtime-gateway/compose_release.sh --commit"
          }

          commit_is_durable() {
            ssh -F "$RUNNER_TEMP/ssh/config" coforge-ecs \
              "COFORGE_EXPECTED_IMAGE='$IMAGE_REF' \
                COFORGE_WORKFLOW_RUN='https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}' \
                \$HOME/.local/share/coforge/realtime-gateway/compose_release.sh --commit-status"
          }

          verify_no_public_http() {
            python3 scripts/deploy/tcp_closed.py "$ECS_HOST" 80 --timeout 5
          }

          if [[ "$PREPARE_OUTCOME" == success ]] \
            && verify_https "https://$ECS_HOST/coforge/readyz" \
            && verify_wss "wss://$ECS_HOST/coforge/v1/connect" \
            && verify_https "https://$ECS_HOST$ECS_SHARED_INGRESS_HEALTH_PATH" \
            && verify_no_public_http \
            && [[ "$(running_image "$IMAGE_REF")" == "$IMAGE_REF" ]]; then
            if commit_release || commit_is_durable; then
              exit 0
            fi
            echo 'release commit failed without durable confirmation; retrying once' >&2
            if commit_release || commit_is_durable; then
              exit 0
            fi
            echo 'release commit could not be reconciled; restoring the previous transaction state' >&2
          fi

          rollback_ok=true
          pending_transaction=false
          if ssh -F "$RUNNER_TEMP/ssh/config" coforge-ecs \
            "test -e \$HOME/.local/share/coforge/realtime-gateway/pending-image"; then
            pending_transaction=true
          fi
          if [[ "$pending_transaction" == true ]]; then
            echo 'external release verification failed; restoring the previous transaction state' >&2
            if ! ssh -F "$RUNNER_TEMP/ssh/config" coforge-ecs \
              "COFORGE_EDGE_BIND_IP='$ECS_EDGE_BIND_IP' \
                COFORGE_TRANSACTION_OWNER='$TRANSACTION_OWNER' \
                \$HOME/.local/share/coforge/realtime-gateway/compose_release.sh --rollback"; then
              rollback_ok=false
            fi
          else
            echo 'candidate preparation failed before mutation; durable failure record retained' >&2
            exit 1
          fi

          if ! verify_https "https://$ECS_HOST$ECS_SHARED_INGRESS_HEALTH_PATH"; then
            rollback_ok=false
          fi
          if ! verify_no_public_http; then
            rollback_ok=false
          fi
          if ! rollback_image=$(ssh -F "$RUNNER_TEMP/ssh/config" coforge-ecs \
            "COFORGE_TRANSACTION_OWNER='$TRANSACTION_OWNER' \
              \$HOME/.local/share/coforge/realtime-gateway/compose_release.sh \
              --rollback-target-image"); then
            rollback_ok=false
            rollback_image=
          fi
          rollback_evidence_result=passed
          if [[ -n "$rollback_image" ]]; then
            if ! verify_https "https://$ECS_HOST/coforge/readyz" \
              || ! verify_wss "wss://$ECS_HOST/coforge/v1/connect" \
              || [[ "$(running_image "$rollback_image")" != "$rollback_image" ]]; then
              echo 'rollback container does not match the recorded digest' >&2
              rollback_ok=false
            fi
          else
            rollback_evidence_result=not-applicable
            if ! compose_project_empty; then
              echo 'bootstrap rollback left containers in the Compose project' >&2
              rollback_ok=false
            fi
          fi
          if [[ "$rollback_ok" != true ]]; then
            record_failed_rollback
            exit 1
          fi
          if ! ssh -F "$RUNNER_TEMP/ssh/config" coforge-ecs \
            "COFORGE_PUBLIC_HEALTH_RESULT='$rollback_evidence_result' \
              COFORGE_SHARED_INGRESS_HEALTH_RESULT=passed \
              COFORGE_WSS_HEALTH_RESULT='$rollback_evidence_result' \
              COFORGE_TCP80_RESULT=passed \
              COFORGE_RUNNING_DIGEST_RESULT='$rollback_evidence_result' \
              COFORGE_TRANSACTION_OWNER='$TRANSACTION_OWNER' \
              \$HOME/.local/share/coforge/realtime-gateway/compose_release.sh --finalize-rollback"; then
            record_failed_rollback
          fi
          exit 1

      - name: Recover interrupted release transaction
        if: ${{ always() }}
        env:
          ECS_EDGE_BIND_IP: ${{ vars.ECS_EDGE_BIND_IP }}
          ECS_HOST: ${{ vars.ECS_HOST }}
          ECS_SHARED_INGRESS_HEALTH_PATH: ${{ vars.ECS_SHARED_INGRESS_HEALTH_PATH }}
          IMAGE_REF: ${{ needs.build.outputs.image_ref }}
          TRANSACTION_OWNER: ${{ github.run_id }}-${{ github.run_attempt }}
        run: scripts/deploy/recover_release.sh

      - name: Collect durable release evidence
        if: ${{ always() }}
        continue-on-error: true
        run: |
          scp -F "$RUNNER_TEMP/ssh/config" \
            coforge-ecs:.local/share/coforge/realtime-gateway/release-history.jsonl \
            "$RUNNER_TEMP/release-history.jsonl"

      - name: Upload release evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-deployment-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-history.jsonl
          if-no-files-found: warn
          retention-days: 90

      - name: Remove remote staging files
        if: ${{ always() }}
        env:
          REMOTE_STAGE: /tmp/coforge-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          ssh -F "$RUNNER_TEMP/ssh/config" coforge-ecs \
            "export XDG_RUNTIME_DIR=/run/user/\$(id -u); \
              export DOCKER_HOST=unix://\$XDG_RUNTIME_DIR/docker.sock; \
              docker logout ghcr.io >/dev/null 2>&1 || true; \
              rm -rf -- '$REMOTE_STAGE'" || true

      - name: Remove local SSH credentials
        if: ${{ always() }}
        run: rm -rf -- "$RUNNER_TEMP/ssh"
