name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  infrastructure-contracts:
    name: Infrastructure contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install pinned toolchain
        uses: jdx/mise-action@v4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test OSS/CDN acceptance verifier
        run: mise run test:oss-cdn

      - name: Check OSS/CDN acceptance verifier
        run: mise run check:oss-cdn

  computer:
    name: Computer
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install pinned toolchain
        uses: jdx/mise-action@v4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test
        run: mise run test:computer

      - name: Check
        run: mise run check:computer

      - name: Build
        run: mise run build:computer

  realtime-gateway:
    name: Realtime gateway
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install pinned toolchain
        uses: jdx/mise-action@v4

      - name: Test
        run: mise run test:gateway

      - name: Check
        run: mise run check:gateway

      - name: Build
        run: mise run build:gateway
