name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  infrastructure-contracts:
    name: Infrastructure contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install pinned toolchain
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: false

      - name: Install toolchain
        run: mise install

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test OSS/CDN acceptance verifier
        run: bun run test:oss-cdn

      - name: Test deploy identity contracts
        run: bun run test:deploy

      - name: Test release build script
        run: bun run test:release

      - name: Lint GitHub workflows
        run: actionlint

      - name: Check OSS/CDN acceptance verifier
        run: bun run check:oss-cdn

      - name: Check deploy scripts
        run: bun run check:deploy

      - name: Check release build script
        run: bun run check:release

  libraries:
    name: Libraries
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install pinned toolchain
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: false

      - name: Install toolchain
        run: mise install

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test
        run: |
          bun run --cwd packages/protocol test
          bun run --cwd packages/agent test
          bun run --cwd packages/cli test

      - name: Check
        run: |
          bun run --cwd packages/protocol check
          bun run --cwd packages/agent check
          bun run --cwd packages/cli check

      - name: Build
        run: |
          bun run --cwd packages/agent build
          bun run --cwd packages/cli build

  computer:
    name: Computer
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install pinned toolchain
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: false

      - name: Install toolchain
        run: mise install

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test
        run: mise run test:computer

      - name: Check
        run: mise run check:computer

      - name: Build
        run: mise run build:computer

  daemon:
    name: Daemon
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install pinned toolchain
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: false

      - name: Install toolchain
        run: mise install

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test
        run: mise run test:daemon

      - name: Check
        run: mise run check:daemon

      - name: Build
        run: mise run build:daemon

  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install pinned toolchain
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: false

      - name: Install toolchain
        run: mise install

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test
        run: mise run test:web

      - name: Check
        run: mise run check:web

      - name: Build
        run: mise run build:web

  # install.sh is gated by shellcheck in the Computer job; install.ps1 had no machine gate at all,
  # which is how a top-level `exit` - fatal under the documented `irm ... | iex` entry point,
  # because it terminates the user's own session - survived in it unnoticed. This job is that
  # missing gate. It is deliberately static: running the installer end to end would need a real
  # Windows binary in a fixture feed and would write to the runner's HKCU\Environment, so nothing
  # here proves the installer's runtime behavior - see the note in the pull request.
  windows-installer:
    name: Windows installer
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Record PowerShell version
        shell: pwsh
        run: $PSVersionTable | Out-String

      - name: Parse with PowerShell 7
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "scripts/release/install.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors) {
            $errors | Out-String | Write-Error
            exit 1
          }

      # install.ps1 documents Windows PowerShell 5.1 as a supported host and carries 5.1-specific
      # workarounds, so the 5.1 preinstalled on this runner parses it too. Its parser rejects
      # syntax that PowerShell 7 accepts, which is the whole point of the second pass.
      - name: Parse with Windows PowerShell 5.1
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "scripts/release/install.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors) {
            $errors | Out-String | Write-Error
            exit 1
          }

      - name: Lint with PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser -SkipPublisherCheck
          # PSAvoidUsingWriteHost targets reusable functions, whose output a caller may want to
          # capture. This is a bootstrap script run as `irm ... | iex`, where the pipeline carries
          # the expression's value: Write-Output would make progress text the result of that
          # expression. Write-Host is the correct call here, so the rule is excluded rather than
          # worked around.
          $findings = Invoke-ScriptAnalyzer -Path "scripts/release/install.ps1" `
            -Severity Warning, Error -ExcludeRule PSAvoidUsingWriteHost
          if ($findings) {
            $findings | Format-Table -AutoSize | Out-String | Write-Error
            exit 1
          }
