name: CI

on:
  pull_request:
  workflow_call:
    inputs:
      track:
        description: "Validation scope: web deployment or local publication"
        required: true
        type: string
    outputs:
      deploy:
        description: Whether this push affects the Web deployment
        value: ${{ jobs.changes.outputs.deploy }}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Plan checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      checks: ${{ steps.select.outputs.checks }}
      libraries: ${{ steps.select.outputs.libraries }}
      contracts: ${{ steps.select.outputs.contracts }}
      jobs: ${{ steps.select.outputs.jobs }}
      deploy: ${{ steps.select.outputs.deploy }}
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - name: Install pinned Bun
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: "2026.9.2"
          install_args: bun
      - name: Find the last successful run
        id: base
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          BRANCH: ${{ github.ref_name }}
        run: |
          # A newer push replaces a pending one, so diff from the last run that succeeded rather
          # than from the previous push: superseded, cancelled, and failed pushes stay in scope.
          workflow="$(gh api "repos/$REPOSITORY/actions/runs/$RUN_ID" --jq .workflow_id)"
          sha="$(gh api "repos/$REPOSITORY/actions/workflows/$workflow/runs?branch=$BRANCH&event=push&status=success&per_page=1" --jq '.workflow_runs[0].head_sha // ""')"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Select checks for changed files
        id: select
        env:
          TRACK: ${{ inputs.track || 'changes' }}
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || steps.base.outputs.sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          files="$RUNNER_TEMP/ci-changed-files"
          if [ "$TRACK" = local ]; then
            : > "$files"
          elif [ "$EVENT" = pull_request ]; then
            git diff --check "$BASE...$HEAD"
            git diff --name-only --no-renames -z "$BASE...$HEAD" > "$files"
          elif [ "$EVENT" = push ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            git diff --check "$BASE" "$HEAD"
            git diff --name-only --no-renames -z "$BASE" "$HEAD" > "$files"
          else
            # No successful run to diff from: full coverage, never a silent skip.
            printf 'mise.toml\0' > "$files"
          fi
          bun scripts/ci/selection.ts "$TRACK" < "$files" | tee -a "$GITHUB_OUTPUT"

  infrastructure-contracts:
    name: Validate ${{ matrix.suite }} scripts
    needs: changes
    if: needs.changes.outputs.contracts != '[]'
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.changes.outputs.contracts) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: "2026.9.2"
          install: false

      - name: Install toolchain
        run: mise install

      - name: Cache Bun packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml', 'bun.lock') }}
          restore-keys: bun-${{ runner.os }}-${{ runner.arch }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun run test:${{ matrix.suite }}

      - name: Run static checks
        run: bun run check:${{ matrix.suite }}

  libraries:
    name: Validate ${{ matrix.package }}
    needs: changes
    if: needs.changes.outputs.libraries != '[]'
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.changes.outputs.libraries) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: "2026.9.2"
          install: false

      - name: Install toolchain
        run: mise install

      - name: Cache Bun packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml', 'bun.lock') }}
          restore-keys: bun-${{ runner.os }}-${{ runner.arch }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate protocol
        run: bun run --cwd packages/coforge-sdk generate

      - name: Run tests
        run: bun run --cwd packages/${{ matrix.package }} test

      - name: Run static checks
        run: bun run --cwd packages/${{ matrix.package }} check

      - name: Build package
        if: matrix.package != 'coforge-sdk'
        run: bun run --cwd packages/${{ matrix.package }} build

  computer:
    name: Validate Computer
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.checks), 'computer')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: "2026.9.2"
          install: false

      - name: Install toolchain
        run: mise install

      - name: Cache Bun packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml', 'bun.lock') }}
          restore-keys: bun-${{ runner.os }}-${{ runner.arch }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: mise run test:computer

      # crates/installer/contract/ is generated from this package (see crates/installer/AGENTS.md); a change to
      # a contract source must commit the regenerated files.
      - name: Check the installer contract is regenerated
        run: |
          bun run --cwd packages/computer generate:installer-contract
          git diff --exit-code -- crates/installer/contract
          untracked="$(git ls-files --others --exclude-standard -- crates/installer/contract)"
          if [ -n "$untracked" ]; then
            echo "::error::Commit the generated installer contract files: $untracked"
            exit 1
          fi

      - name: Run static checks
        run: mise run check:computer

      - name: Build package
        run: mise run build:computer

  daemon:
    name: Validate Daemon
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.checks), 'daemon')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: "2026.9.2"
          install: false

      - name: Install toolchain
        run: mise install

      - name: Cache Bun packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml', 'bun.lock') }}
          restore-keys: bun-${{ runner.os }}-${{ runner.arch }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: mise run test:daemon

      - name: Run static checks
        run: mise run check:daemon

      - name: Build package
        run: mise run build:daemon

  macos-lifecycle:
    name: Test macOS lifecycle
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.checks), 'macos-lifecycle')
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Set up mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: "2026.9.2"
          install: false
      - name: Install toolchain
        run: mise install
      - name: Cache Bun packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml', 'bun.lock') }}
          restore-keys: bun-${{ runner.os }}-${{ runner.arch }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Generate protocol
        run: bun run --cwd packages/coforge-sdk generate
      - name: Verify real launchd lifecycle
        run: bun test packages/daemon/test/launchd-job.test.ts packages/daemon/test/launchd-process.test.ts packages/daemon/test/macos-supervisor.test.ts
      - name: Verify published macOS executable signature and modes
        # Bun < 1.4.2 wrote an invalid ad-hoc signature that macOS 27 kills at launch; the test
        # runs `codesign --verify --strict` so the regression fails here, not on user machines.
        run: bun test scripts/release/compile-targets.test.ts

  web:
    name: Validate Web
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.checks), 'web')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: "2026.9.2"
          install: false

      - name: Install toolchain
        run: mise install

      - name: Cache Bun packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml', 'bun.lock') }}
          restore-keys: bun-${{ runner.os }}-${{ runner.arch }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: mise run test:web

      - name: Run static checks
        run: mise run check:web

      - name: Build package
        # The deployment's Docker build validates and tests the actual runtime image.
        if: inputs.track != 'web'
        run: mise run build:web

  windows-release:
    name: Test Windows ${{ matrix.runner == 'windows-latest' && 'x64' || 'arm64' }} executable
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.checks), 'windows-release')
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Install pinned Bun
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: "2026.9.2"
          install_args: bun
      - name: Cache Bun packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml', 'bun.lock') }}
          restore-keys: bun-${{ runner.os }}-${{ runner.arch }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Generate protocol
        run: bun run --cwd packages/coforge-sdk generate
      - name: Test compiled version and server configuration
        env:
          # GitHub empties runner.temp at job boundaries. Each test creates a unique
          # subdirectory; external Windows readers must not fail functional tests.
          COFORGE_RELEASE_TEST_ARTIFACT_ROOT: ${{ runner.temp }}
        run: bun test scripts/release/compile-targets.test.ts --test-name-pattern "published Computer"

  # install.sh is gated by shellcheck in the Computer job; install.ps1 had no machine gate at all,
  # which is how a top-level `exit` - fatal under the documented `irm ... | iex` entry point,
  # because it terminates the user's own session - survived in it unnoticed. This job is that
  # missing gate. It is deliberately static: running the installer end to end would need a real
  # Windows binary in a fixture feed and would write to the runner's HKCU\Environment, so nothing
  # here proves the installer's runtime behavior - see the note in the pull request.
  windows-installer:
    name: Check Windows installer
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.checks), 'windows-installer')
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Record PowerShell version
        shell: pwsh
        run: $PSVersionTable | Out-String

      - name: Parse with PowerShell 7
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "scripts/release/install.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors) {
            $errors | Out-String | Write-Error
            exit 1
          }

      # install.ps1 documents Windows PowerShell 5.1 as a supported host and carries 5.1-specific
      # workarounds, so the 5.1 preinstalled on this runner parses it too. Its parser rejects
      # syntax that PowerShell 7 accepts, which is the whole point of the second pass.
      - name: Parse with Windows PowerShell 5.1
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "scripts/release/install.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors) {
            $errors | Out-String | Write-Error
            exit 1
          }

      - name: Lint with PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser -SkipPublisherCheck
          # PSAvoidUsingWriteHost targets reusable functions, whose output a caller may want to
          # capture. This is a bootstrap script run as `irm ... | iex`, where the pipeline carries
          # the expression's value: Write-Output would make progress text the result of that
          # expression. Write-Host is the correct call here, so the rule is excluded rather than
          # worked around.
          $findings = Invoke-ScriptAnalyzer -Path "scripts/release/install.ps1" `
            -Severity Warning, Error -ExcludeRule PSAvoidUsingWriteHost
          if ($findings) {
            $findings | Format-Table -AutoSize | Out-String | Write-Error
            exit 1
          }

  # The Rust installer crate (crates/installer/, its own toolchain in crates/installer/mise.toml): lint, test,
  # and release-build it on the native runner of each of its six release targets, and gate its
  # dependency graph (licenses, bans, sources, RustSec advisories) once on linux-x64.
  # Runner labels: https://docs.github.com/en/actions/reference/runners/github-hosted-runners
  installer-crate:
    name: Check installer ${{ matrix.release_target }}
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.checks), 'installer-crate')
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple's linker ad-hoc signs arm64 output itself; macOS 27 kills arm64 binaries whose
          # signature is invalid, so the job verifies it with `codesign --verify --strict`.
          - release_target: darwin-arm64
            rust_target: aarch64-apple-darwin
            runner: macos-latest
            native: true
            tools: rust bun
          # Cross-compiled on the arm64 runner. The linker leaves x86_64 output unsigned, so the
          # job ad-hoc signs it the way Bun signs its darwin-x64 executables.
          - release_target: darwin-x64
            rust_target: x86_64-apple-darwin
            runner: macos-latest
            native: false
            tools: rust
          # musl, statically linked: no glibc version floor on the user's machine. This entry
          # also runs the target-independent checks, so it installs the supply-chain tools.
          - release_target: linux-x64
            rust_target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
            native: true
            tools: rust bun cargo-deny github:rustsec/rustsec github:EmbarkStudios/cargo-about
          - release_target: linux-arm64
            rust_target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            native: true
            tools: rust bun
          - release_target: windows-x64
            rust_target: x86_64-pc-windows-msvc
            runner: windows-latest
            native: true
            tools: rust bun
          # ring needs clang for this target; ring's own CI builds it on windows-11-arm with the
          # runner image's Visual Studio toolchain and no extra install step.
          - release_target: windows-arm64
            rust_target: aarch64-pc-windows-msvc
            runner: windows-11-arm
            native: true
            tools: rust bun
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: crates/installer
    env:
      # The workspace's target directory is at the repository root.
      BINARY: ../../target/${{ matrix.rust_target }}/release/coforge-installer${{ startsWith(matrix.release_target, 'windows') && '.exe' || '' }}
      # `mise exec` would otherwise install every tool in crates/installer/mise.toml (and the root one)
      # that is missing, including supply-chain tools only linux-x64 installs and uses; cargo-audit
      # publishes no windows-arm64 build. Each entry uses exactly its `tools`.
      # https://mise.jdx.dev/configuration/settings.html#exec_auto_install
      MISE_EXEC_AUTO_INSTALL: "false"

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      # From crates/installer/ mise also sees the root tools, so install only what this entry uses.
      - name: Install pinned Rust tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: "2026.9.2"
          working_directory: crates/installer
          install_args: ${{ matrix.tools }}

      - name: Add the Rust target
        run: mise exec rust -- rustup target add "${{ matrix.rust_target }}"

      - name: Install the musl C compiler for ring
        if: startsWith(matrix.release_target, 'linux')
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends musl-tools
          target="${{ matrix.rust_target }}"
          echo "CC_${target//-/_}=musl-gcc" >> "$GITHUB_ENV"

      - name: Check formatting
        if: matrix.release_target == 'linux-x64'
        run: mise exec rust -- cargo fmt --check

      # Per target: cfg(unix) and cfg(windows) code differs.
      - name: Lint
        run: mise exec rust -- cargo clippy --locked --all-targets --target "${{ matrix.rust_target }}" -- -D warnings

      # Bun runs the Computer's own machine mutation lock (packages/daemon) against the
      # installer's in src/lock/tests.rs, so the two are proven to exclude each other.
      - name: Test
        if: matrix.native
        run: mise exec rust bun -- cargo test --locked --target "${{ matrix.rust_target }}"

      # The tests write what the installer produces into contract/rust/, which the Computer
      # package's tests read back; the committed copy must match on every native target.
      - name: Check the contract output is committed
        if: matrix.native
        run: |
          git diff --exit-code -- contract
          untracked="$(git ls-files --others --exclude-standard -- contract)"
          if [ -n "$untracked" ]; then
            echo "::error::Commit the installer's contract output: $untracked"
            exit 1
          fi

      - name: Build release binary
        run: mise exec rust -- cargo build --locked --release --target "${{ matrix.rust_target }}"

      - name: Ad-hoc sign the x86_64 darwin binary
        if: matrix.release_target == 'darwin-x64'
        run: codesign --sign - --force "$BINARY"

      - name: Verify the darwin signature
        if: startsWith(matrix.release_target, 'darwin')
        run: |
          codesign -dv --verbose=2 "$BINARY"
          codesign --verify --strict --verbose=2 "$BINARY"

      - name: Report binary size
        run: |
          size="$(wc -c < "$BINARY" | tr -d ' ')"
          echo "${{ matrix.release_target }}: $size bytes"
          echo "coforge-installer ${{ matrix.release_target }}: $size bytes" >> "$GITHUB_STEP_SUMMARY"
          file "$BINARY" || true

      - name: Show that the Linux binary is static
        if: startsWith(matrix.release_target, 'linux')
        run: ldd "$BINARY" || true

      - name: Run on the native host
        if: matrix.native
        run: '"$BINARY" --version'

      - name: Run under Rosetta when available
        if: matrix.release_target == 'darwin-x64'
        run: |
          if arch -x86_64 /usr/bin/true 2>/dev/null; then
            arch -x86_64 "$BINARY" --version
          else
            echo "::warning::Rosetta is not installed on this runner; darwin-x64 was built but not run"
          fi

      - name: Check dependency licenses, bans, sources, and advisories
        if: matrix.release_target == 'linux-x64'
        run: mise exec -- cargo deny --locked check licenses bans sources advisories

      - name: Audit dependencies against RustSec
        if: matrix.release_target == 'linux-x64'
        run: mise exec -- cargo audit --deny warnings --file ../../Cargo.lock

      - name: Generate third-party notices
        if: matrix.release_target == 'linux-x64'
        run: mise exec -- cargo about generate --locked --fail --output-file THIRD_PARTY_NOTICES.txt about/notices.hbs

      - name: Upload third-party notices
        if: matrix.release_target == 'linux-x64'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coforge-installer-third-party-notices
          path: crates/installer/THIRD_PARTY_NOTICES.txt
          if-no-files-found: error

  ci-passed:
    name: CI passed
    if: always()
    needs: [changes, infrastructure-contracts, libraries, computer, daemon, macos-lifecycle, web, windows-release, windows-installer, installer-crate]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every selected job to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          printf '%s\n' "$NEEDS" | jq -e '
            . as $needs |
            .changes.result == "success" and
            ((.changes.outputs.jobs | fromjson) | all(.[]; $needs[.].result == "success")) and
            all(.[]; .result == "success" or .result == "skipped")
          '
