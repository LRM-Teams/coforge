name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  infrastructure-contracts:
    name: Infrastructure contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install pinned toolchain
        uses: jdx/mise-action@v4
        with:
          install: false

      - name: Install toolchain
        run: mise install

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test OSS/CDN acceptance verifier
        run: mise run test:oss-cdn

      - name: Check OSS/CDN acceptance verifier
        run: mise run check:oss-cdn

      - name: Test deploy identity contracts
        run: mise run test:deploy

      - name: Check deploy scripts
        run: mise run check:deploy

  computer:
    name: Computer
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install pinned toolchain
        uses: jdx/mise-action@v4
        with:
          install: false

      - name: Install toolchain
        run: mise install

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test
        run: mise run test:computer

      - name: Check
        run: mise run check:computer

      - name: Build
        run: mise run build:computer

  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install pinned toolchain
        uses: jdx/mise-action@v4
        with:
          install: false

      - name: Install toolchain
        run: mise install

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test
        run: mise run test:web

      - name: Check
        run: mise run check:web

      - name: Build
        run: mise run build:web
