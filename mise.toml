[tools]
node = "24"
bun = "1.4"
actionlint = "1.7.12"
shellcheck = "0.11.0"

[tasks.install]
description = "Install all workspace dependencies"
run = "bun install --frozen-lockfile"

[tasks.test]
description = "Run repository tests"
run = "bun run test"

[tasks.check]
description = "Run repository format, lint, and type checks"
run = "bun run check"

[tasks.build]
description = "Build deployable cloud applications"
run = "bun run build"

[tasks."test:computer"]
run = "cd apps/coforge-computer && bun test"

[tasks."check:computer"]
run = "cd apps/coforge-computer && bun run check"

[tasks."build:computer"]
run = "cd apps/coforge-computer && bun run build"

[tasks."test:oss-cdn"]
run = "bun run test:oss-cdn"

[tasks."check:oss-cdn"]
run = "bun run check:oss-cdn"

[tasks."verify:oss-cdn"]
run = "bun run verify:oss-cdn"
