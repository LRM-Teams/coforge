[vars]
# The suites test:thread and test:channel both run, named once so the two lists cannot drift apart.
thread_integration_files = "./apps/web/test/public-channel.integration.ts ./apps/web/test/project-channels.integration.ts ./apps/web/test/project-images.integration.ts ./apps/web/test/workspace-images.integration.ts ./apps/web/test/workspace-members.integration.ts ./apps/web/test/action-cards.integration.ts ./apps/web/test/channel-member-changed.integration.test.ts ./apps/web/test/channel-settings.integration.test.ts ./apps/web/test/channel-viewer-events.integration.test.ts ./apps/web/test/dm-viewer-events.integration.test.ts ./apps/web/test/activity-viewer-events.integration.test.ts ./apps/web/test/saved-viewer-events.integration.test.ts ./apps/web/test/own-message-signal.integration.test.ts ./apps/web/test/assignment-receipt-signal.integration.test.ts ./apps/web/test/general-channel.integration.test.ts ./apps/web/test/general-channel-hidden.integration.test.ts ./apps/web/test/user-direct-conversations.integration.ts ./apps/web/test/workspace-url-selection.integration.ts ./apps/web/test/workspace-member-leave.integration.test.ts"

[tools]
node = "24"
bun = "1.4.2"
actionlint = "1.7.12"
shellcheck = "0.11.0"

[tasks.setup]
description = "Install frozen workspace dependencies"
run = "bun install --frozen-lockfile"

[tasks.test]
description = "Run repository tests"
run = "bun run test"

[tasks.check]
description = "Run repository format, lint, and type checks"
run = "bun run check"

[tasks.build]
description = "Build all buildable workspaces"
run = "bun run build"

[tasks."test:computer"]
description = "Run Computer package tests"
run = "bun run --cwd packages/coforge-sdk generate && cd packages/computer && bun test"

[tasks."test:daemon"]
description = "Run Daemon package tests"
run = "bun run --cwd packages/coforge-sdk generate && cd packages/daemon && bun run test"

[tasks."check:daemon"]
description = "Run Daemon package checks"
run = "bun run --cwd packages/coforge-sdk generate && cd packages/daemon && bun run check"

[tasks."build:daemon"]
description = "Build the Daemon package"
run = "bun run --cwd packages/coforge-sdk generate && cd packages/daemon && bun run build"

[tasks."check:computer"]
description = "Run Computer package checks"
run = "bun run --cwd packages/coforge-sdk generate && cd packages/computer && bun run check"

[tasks."build:computer"]
description = "Build the Computer package"
run = "bun run --cwd packages/coforge-sdk generate && cd packages/computer && bun run build"

[tasks."reload:computer"]
description = "Rebuild local Computer/Daemon fixture, install to ~/.coforge, restart daemon"
run = "bash scripts/reload-local-computer.sh"

[tasks."test:web"]
description = "Run Web package tests"
run = "bun run --cwd packages/coforge-sdk generate && cd apps/web && bun run test"

[tasks."test:centrifugo"]
description = "Run the Daemon's connection, and Workspace deletion's daemon reconnect, against the Centrifugo image staging uses (Docker required)"
run = "bun run --cwd packages/coforge-sdk generate && bun run --cwd apps/web db:generate && bun test ./packages/daemon/test/daemon-connection-refusal.integration.ts ./apps/web/test/centrifugo-daemon-reconnect.integration.ts"

[tasks."test:thread"]
description = "Run thread isolation against local PostgreSQL (THREAD_TEST_DATABASE_URL required)"
run = "bun run --cwd packages/coforge-sdk generate && bun run --cwd apps/web db:generate && bun test {{vars.thread_integration_files}}"

[tasks."test:events"]
description = "Run the Agent events drain against local PostgreSQL (EVENTS_TEST_DATABASE_URL required)"
run = "bun run --cwd packages/coforge-sdk generate && bun run --cwd apps/web db:generate && bun test ./apps/web/test/agent-events.integration.ts"

[tasks."test:channel"]
description = "Run public channels, Workspace members and deletion, and daemon credential revocations against local PostgreSQL and Redis (CHANNEL_TEST_DATABASE_URL and CHANNEL_TEST_REDIS_URL required)"
run = "bun run --cwd packages/coforge-sdk generate && bun run --cwd apps/web db:generate && bun test {{vars.thread_integration_files}} ./apps/web/test/daemon-credential-revocations.integration.test.ts ./apps/web/test/workspace-catalog.integration.ts ./apps/web/test/conversation-threads.integration.test.ts ./apps/web/test/workspace-join-links.integration.test.ts ./apps/web/test/workspace-delete.integration.test.ts ./apps/web/test/channel-delete.integration.test.ts ./apps/web/test/user-identity.integration.test.ts"

[tasks."test:integration:web"]
description = "Run the Web integration suites CI cannot, against a scratch PostgreSQL/Redis (INTEGRATION_DATABASE_URL and INTEGRATION_REDIS_URL override the defaults)"
run = "./scripts/test/run-web-integration.sh"

[tasks."test:e2e:agent-direct-message"]
description = "Run the managed Agent direct-message end-to-end slice"
run = """
amp orb services ensure >/dev/null || {
  curl --fail --silent http://127.0.0.1:8000/health >/dev/null
  curl --fail --silent http://127.0.0.1:8789/health >/dev/null
}
./scripts/e2e/run-agent-direct-message.sh
"""

[tasks."test:e2e:mention-delivery"]
description = "Run the tracked @mention delivery end-to-end slice"
run = "./scripts/e2e/run-mention-delivery.sh"

[tasks."test:e2e:web"]
description = "Run one browser e2e from apps/web/test against a local stack (no file lists them)"
run = './scripts/e2e/run-web-e2e.sh {{arg(name="file", var=true, default="")}}'

[tasks."check:web"]
description = "Run Web package checks"
run = "bun run --cwd packages/coforge-sdk generate && cd apps/web && bun run check"

[tasks."build:web"]
description = "Build the Web package"
run = "bun run --cwd packages/coforge-sdk generate && cd apps/web && bun run build"

[tasks."verify:oss-cdn"]
description = "Verify OSS/CDN acceptance evidence"
run = "bun run verify:oss-cdn"
