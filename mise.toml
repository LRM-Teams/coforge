[tools]
node = "24"
bun = "1.4.2"
actionlint = "1.7.12"
shellcheck = "0.11.0"

[tasks.setup]
description = "Install frozen workspace dependencies"
run = "bun install --frozen-lockfile"

[tasks.test]
description = "Run repository tests"
run = "bun run test"

[tasks.check]
description = "Run repository format, lint, and type checks"
run = "bun run check"

[tasks.build]
description = "Build all buildable workspaces"
run = "bun run build"

[tasks."test:computer"]
description = "Run Computer package tests"
run = "bun run --cwd packages/coforge-sdk generate && cd packages/computer && bun test"

[tasks."test:daemon"]
description = "Run Daemon package tests"
run = "bun run --cwd packages/coforge-sdk generate && cd packages/daemon && bun run test"

[tasks."check:daemon"]
description = "Run Daemon package checks"
run = "bun run --cwd packages/coforge-sdk generate && cd packages/daemon && bun run check"

[tasks."build:daemon"]
description = "Build the Daemon package"
run = "bun run --cwd packages/coforge-sdk generate && cd packages/daemon && bun run build"

[tasks."check:computer"]
description = "Run Computer package checks"
run = "bun run --cwd packages/coforge-sdk generate && cd packages/computer && bun run check"

[tasks."build:computer"]
description = "Build the Computer package"
run = "bun run --cwd packages/coforge-sdk generate && cd packages/computer && bun run build"

[tasks."reload:computer"]
description = "Rebuild local Computer/Daemon fixture, install to ~/.coforge, restart daemon"
run = "bash scripts/reload-local-computer.sh"

[tasks."test:memory"]
description = "Run Group Memory / LearnedSkill value semantics against local PostgreSQL (MEMORY_TEST_DATABASE_URL required)"
run = "bun run --cwd packages/coforge-sdk generate && bun run --cwd apps/web db:generate && bun test ./apps/web/test/group-memory.integration.ts ./apps/web/test/group-memory-ingestion.integration.ts ./apps/web/test/group-memory-distillation.test.ts ./apps/web/test/group-memory-distillation.integration.ts ./apps/web/test/learned-skills.integration.ts ./apps/web/test/group-memory-exploration.integration.ts ./apps/web/test/group-memory-agent.integration.ts ./apps/web/test/shadow-gate.integration.ts ./apps/web/test/agent-memory-http.integration.ts ./apps/web/test/memory-agent-scenarios.integration.ts ./apps/web/test/memory-agent-protocol.integration.ts"

[tasks."test:e2e:group-memory"]
description = "Run the LearnedSkill loop real-LLM smoke (MEMORY_SMOKE_API_KEY required; skips cleanly without it)"
run = "bun run --cwd packages/coforge-sdk generate && bun run --cwd apps/web db:generate && ./scripts/e2e/run-group-memory-smoke.sh"

[tasks."test:e2e:memory-agent"]
description = "Memory Agent full-stack smoke against a live model (MANUAL GATE: real tokens; MEMORY_SMOKE_API_KEY required, skips cleanly without it)"
run = "bun run --cwd packages/coforge-sdk generate && bun run --cwd apps/web db:generate && ./scripts/e2e/run-memory-agent-smoke.sh"

[tasks."test:e2e:memory-explorer-turn"]
description = "Fenced Memory Agent turn smoke against a live model (MANUAL GATE: real tokens; asserts the model reaches memory_start with a contract-valid start key; MEMORY_SMOKE_API_KEY required, skips cleanly without it)"
run = "./scripts/e2e/run-memory-explorer-turn.sh"

[tasks."test:web"]
description = "Run Web package tests"
run = "bun run --cwd packages/coforge-sdk generate && cd apps/web && bun run test"

[tasks."test:thread"]
description = "Run thread isolation against local PostgreSQL (THREAD_TEST_DATABASE_URL required)"
run = "bun run --cwd packages/coforge-sdk generate && bun run --cwd apps/web db:generate && bun test ./apps/web/test/direct-thread.integration.ts"

[tasks."test:events"]
description = "Run the Agent events drain against local PostgreSQL (EVENTS_TEST_DATABASE_URL required)"
run = "bun run --cwd packages/coforge-sdk generate && bun run --cwd apps/web db:generate && bun test ./apps/web/test/agent-events.integration.ts"

[tasks."test:channel"]
description = "Run public channels and Workspace members against local PostgreSQL and Redis (CHANNEL_TEST_DATABASE_URL and CHANNEL_TEST_REDIS_URL required)"
run = "bun run --cwd packages/coforge-sdk generate && bun run --cwd apps/web db:generate && bun test ./apps/web/test/public-channel.integration.ts ./apps/web/test/project-channels.integration.ts ./apps/web/test/project-images.integration.ts ./apps/web/test/workspace-members.integration.ts ./apps/web/test/action-cards.integration.ts"

[tasks."test:e2e:agent-direct-message"]
description = "Run the managed Agent direct-message end-to-end slice"
run = """
amp orb services ensure >/dev/null || {
  curl --fail --silent http://127.0.0.1:8000/health >/dev/null
  curl --fail --silent http://127.0.0.1:8789/health >/dev/null
}
./scripts/e2e/run-agent-direct-message.sh
"""

[tasks."check:web"]
description = "Run Web package checks"
run = "bun run --cwd packages/coforge-sdk generate && cd apps/web && bun run check"

[tasks."build:web"]
description = "Build the Web package"
run = "bun run --cwd packages/coforge-sdk generate && cd apps/web && bun run build"

[tasks."verify:oss-cdn"]
description = "Verify OSS/CDN acceptance evidence"
run = "bun run verify:oss-cdn"
