[tools]
node = "24"
bun = "1.4"
go = "1.26.7"

[tasks.install]
description = "Install all workspace dependencies"
run = "bun install --frozen-lockfile"

[tasks.test]
description = "Run repository tests"
run = "bun run test"

[tasks.check]
description = "Run repository type checks"
run = "bun run typecheck"

[tasks.build]
description = "Build deployable cloud applications"
run = "bun run build"
