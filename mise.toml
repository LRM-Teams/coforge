[tools]
node = "24"
bun = "1.4"
actionlint = "1.7.12"
shellcheck = "0.11.0"

[tasks.setup]
description = "Install frozen workspace dependencies"
run = "bun install --frozen-lockfile"

[tasks.test]
description = "Run repository tests"
run = "bun run test"

[tasks.check]
description = "Run repository format, lint, and type checks"
run = "bun run check"

[tasks.build]
description = "Build all buildable workspaces"
run = "bun run build"

[tasks."test:computer"]
description = "Run Computer package tests"
run = "bun run --cwd packages/protocol generate && cd packages/computer && bun test"

[tasks."test:daemon"]
description = "Run Daemon package tests"
run = "bun run --cwd packages/protocol generate && cd packages/daemon && bun run test"

[tasks."check:daemon"]
description = "Run Daemon package checks"
run = "bun run --cwd packages/protocol generate && cd packages/daemon && bun run check"

[tasks."build:daemon"]
description = "Build the Daemon package"
run = "bun run --cwd packages/protocol generate && cd packages/daemon && bun run build"

[tasks."check:computer"]
description = "Run Computer package checks"
run = "bun run --cwd packages/protocol generate && cd packages/computer && bun run check"

[tasks."build:computer"]
description = "Build the Computer package"
run = "bun run --cwd packages/protocol generate && cd packages/computer && bun run build"

[tasks."test:web"]
description = "Run Web package tests"
run = "bun run --cwd packages/protocol generate && cd apps/web && bun run test"

[tasks."test:e2e:agent-direct-message"]
description = "Run the managed Agent direct-message end-to-end slice"
run = """
amp orb services ensure >/dev/null || {
  curl --fail --silent http://127.0.0.1:8000/health >/dev/null
  curl --fail --silent http://127.0.0.1:8789/health >/dev/null
}
./scripts/e2e/run-agent-direct-message.sh
"""

[tasks."check:web"]
description = "Run Web package checks"
run = "bun run --cwd packages/protocol generate && cd apps/web && bun run check"

[tasks."build:web"]
description = "Build the Web package"
run = "bun run --cwd packages/protocol generate && cd apps/web && bun run build"

[tasks."verify:oss-cdn"]
description = "Verify OSS/CDN acceptance evidence"
run = "bun run verify:oss-cdn"
