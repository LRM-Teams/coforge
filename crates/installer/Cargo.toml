[package]
name = "coforge-installer"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false
description = "The CoForge Computer installer, released as its own native binary"

[dependencies]
flate2 = "1"
lexopt = "0.3"
rusqlite = { version = "0.40.2", features = ["bundled"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
# No default features: the default `gzip` feature makes ureq send Accept-Encoding and decode
# Content-Encoding transparently, but the manifest checksum is over the exact wire bytes.
# `rustls` = rustls with the ring provider and the webpki-roots (Mozilla) trust store.
ureq = { version = "3", default-features = false, features = ["rustls"] }
